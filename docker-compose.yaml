x-settings:
  mysql_env_vars: &mysql_env_vars
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  prefect_api_var: &prefect_api_var
    PREFECT_API_URL: http://prefect-server:4200/api

  worker_base: &worker_base
    build:
      target: api
    environment:
      <<: [*mysql_env_vars, *prefect_api_var]
    depends_on:
      prefect-server:
        condition: service_healthy
        
services:
  api:
    build:
      target:  api
    # image: test-autofill-app-with-prefect-api-sample-website
    volumes: 
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./.python-version:/app/.python-version
      - ./payer_website_autofiller:/app/payer_website_autofiller
      - ./videos:/app/videos
      - ./tests:/app/tests
    working_dir: /app
    command:
      - uv
      - run
      - uvicorn
      - payer_website_autofiller.frontend.main:app
      - --reload
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # Database service
  db:
    image: mysql:latest
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      <<: *mysql_env_vars

  # Prefect services
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  valkey:
    image: valkey/valkey:7
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  prefect-server:
    image: prefecthq/prefect:3-latest
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: valkey
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: valkey
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start

  prefect-worker:
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: prefect worker start --pool local-pool
    restart: on-failure

  # Worker services
  humana-behavioral-health-worker:
    <<: *worker_base
    command: uv run -m payer_website_autofiller.workers.humana.behavioral_health_worker

  humana-specific-states-worker:
    <<: *worker_base
    command: uv run -m payer_website_autofiller.workers.humana.specific_states_worker

  sample-payer-website-worker:
    <<: *worker_base
    command: uv run -m payer_website_autofiller.workers.sample_payer.sample_website_worker

volumes:
  postgres_data:
  valkey_data:
  mysql_data: